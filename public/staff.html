<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>服務生點餐</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>服務生點餐</h1>
  <span id="tableBadge"></span>
</header>

<div class="container">
  <div id="tableSelect"></div>
  <div id="orderingArea" style="display:none;">
    <button class="btn-secondary" onclick="backToTables()" style="margin-bottom:12px;">← 切換桌位</button>
    <div class="category-tabs" id="categoryTabs"></div>
    <div id="itemsList"></div>
  </div>
</div>

<div class="cart-bar" id="cartBar" style="display:none;" onclick="openCart()">
  <span id="cartSummary">購物車 0 項</span>
  <span class="btn-primary">查看購物車</span>
</div>

<div id="cartModal"></div>
<div id="confirmModal"></div>

<script>
let tables = [];
let menu = [];
let cart = {};
let activeCategory = null;
let currentTable = null;

async function init() {
  const [tRes, mRes] = await Promise.all([fetch('/api/tables'), fetch('/api/menu')]);
  tables = await tRes.json();
  menu = await mRes.json();
  renderTableSelect();
}

function renderTableSelect() {
  const el = document.getElementById('tableSelect');
  el.innerHTML = '<h2 style="margin-bottom:10px;">請選擇桌位</h2><div class="qr-list"></div>';
  const grid = el.querySelector('.qr-list');
  tables.forEach(t => {
    const card = document.createElement('div');
    card.className = 'qr-card';
    card.style.cursor = 'pointer';
    const statusLabel = { available: '空桌', occupied: '使用中', needs_cleaning: '待清潔' }[t.status] || t.status;
    card.innerHTML = `<h3>${t.table_number}</h3><p>${t.seats} 人桌</p><span class="tag ${t.status === 'occupied' ? 'preparing' : 'completed'}">${statusLabel}</span>`;
    card.onclick = () => selectTable(t);
    grid.appendChild(card);
  });
}

function selectTable(t) {
  currentTable = t;
  document.getElementById('tableBadge').textContent = '桌號 ' + t.table_number;
  document.getElementById('tableSelect').style.display = 'none';
  document.getElementById('orderingArea').style.display = 'block';
  cart = {};
  renderCategories();
  updateCartBar();
}

function backToTables() {
  document.getElementById('tableSelect').style.display = 'block';
  document.getElementById('orderingArea').style.display = 'none';
  document.getElementById('tableBadge').textContent = '';
  cart = {};
  updateCartBar();
}

function renderCategories() {
  const tabs = document.getElementById('categoryTabs');
  tabs.innerHTML = '';
  if (!activeCategory && menu.length) activeCategory = menu[0].id;
  menu.forEach(cat => {
    const btn = document.createElement('button');
    btn.textContent = cat.name;
    if (cat.id === activeCategory) btn.classList.add('active');
    btn.onclick = () => { activeCategory = cat.id; renderCategories(); renderItems(); };
    tabs.appendChild(btn);
  });
  renderItems();
}

function renderItems() {
  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  const cat = menu.find(c => c.id === activeCategory);
  if (!cat) return;
  cat.items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'menu-item' + (item.is_available ? '' : ' unavailable');
    const qty = cart[item.id] ? cart[item.id].qty : 0;
    div.innerHTML = `
      <div class="info">
        <h3>${item.name}</h3>
        <p>${item.description || ''}</p>
        <div class="price">NT$ ${Number(item.price).toFixed(0)}</div>
      </div>
      <div class="qty-control">
        <button onclick="changeQty(${item.id}, -1)">－</button>
        <span>${qty}</span>
        <button onclick="changeQty(${item.id}, 1)" ${item.is_available ? '' : 'disabled'}>＋</button>
      </div>`;
    list.appendChild(div);
  });
}

function changeQty(itemId, delta) {
  const allItems = menu.flatMap(c => c.items);
  const item = allItems.find(i => i.id === itemId);
  if (!item) return;
  const existing = cart[itemId] || { item, qty: 0 };
  existing.qty = Math.max(0, existing.qty + delta);
  if (existing.qty === 0) delete cart[itemId];
  else cart[itemId] = existing;
  renderItems();
  updateCartBar();
}

function updateCartBar() {
  const bar = document.getElementById('cartBar');
  const count = Object.values(cart).reduce((s, c) => s + c.qty, 0);
  if (count === 0 || !currentTable) { bar.style.display = 'none'; return; }
  bar.style.display = 'flex';
  document.getElementById('cartSummary').textContent = `購物車 ${count} 項`;
}

function openCart() {
  const items = Object.values(cart);
  const total = items.reduce((s, c) => s + c.qty * c.item.price, 0);
  const modal = document.getElementById('cartModal');
  modal.innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeCart()">
      <div class="modal-sheet">
        <h2>桌號 ${currentTable.table_number} 訂單</h2>
        <ul>
        ${items.map(c => `
          <li style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed #eee;">
            <span>${c.item.name} x ${c.qty}</span>
            <span>NT$ ${(c.item.price * c.qty).toFixed(0)}</span>
          </li>`).join('')}
        </ul>
        <p style="margin:12px 0;font-weight:600;">總計：NT$ ${total.toFixed(0)}</p>
        <label>備註</label>
        <textarea id="orderNotes" rows="2"></textarea>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn-secondary" style="flex:1" onclick="closeCart()">繼續點餐</button>
          <button class="btn-primary" style="flex:1" onclick="submitOrder()">送出訂單</button>
        </div>
      </div>
    </div>`;
}

function closeCart() { document.getElementById('cartModal').innerHTML = ''; }

async function submitOrder() {
  const items = Object.values(cart).map(c => ({
    menu_item_id: c.item.id, item_name: c.item.name, item_price: c.item.price, quantity: c.qty
  }));
  const notes = document.getElementById('orderNotes').value;
  try {
    const res = await fetch('/api/orders', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        order_type: 'dine_in', source: 'staff',
        table_id: currentTable.id, notes, items
      })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '送出失敗');
    cart = {};
    closeCart();
    updateCartBar();
    alert('訂單已送出，編號：' + data.order_no);
    backToTables();
    init();
  } catch (e) {
    alert('送出訂單失敗：' + e.message);
  }
}

init();
</script>
</body>
</html>
