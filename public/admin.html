<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar"><h1>後台管理</h1></header>

<div class="container">
  <nav class="admin-tabs">
    <button id="tab-menu" class="active" onclick="switchTab('menu')">菜單管理</button>
    <button id="tab-tables" onclick="switchTab('tables')">桌位管理</button>
    <button id="tab-orders" onclick="switchTab('orders')">訂單總覽</button>
  </nav>

  <div id="panel-menu"></div>
  <div id="panel-tables" style="display:none;"></div>
  <div id="panel-orders" style="display:none;"></div>
</div>

<div id="modalRoot"></div>

<script>
let categories = [];
let tables = [];
let orders = [];

function switchTab(tab) {
  ['menu','tables','orders'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('active', t === tab);
    document.getElementById('panel-' + t).style.display = t === tab ? 'block' : 'none';
  });
  if (tab === 'menu') loadMenu();
  if (tab === 'tables') loadTables();
  if (tab === 'orders') loadOrders();
}

/* ---------------- 菜單管理 ---------------- */
async function loadMenu() {
  const res = await fetch('/api/menu');
  categories = await res.json();
  renderMenuPanel();
}

function renderMenuPanel() {
  const panel = document.getElementById('panel-menu');
  panel.innerHTML = `
    <button class="btn-primary" onclick="openCategoryForm()">＋ 新增分類</button>
    <div id="categoriesList" style="margin-top:14px;"></div>`;
  const list = document.getElementById('categoriesList');
  categories.forEach(cat => {
    const block = document.createElement('div');
    block.style.marginBottom = '20px';
    block.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <h3>${cat.name}</h3>
        <div>
          <button class="btn-secondary" onclick="openCategoryForm(${cat.id})">編輯分類</button>
          <button class="btn-danger" onclick="deleteCategory(${cat.id})">刪除分類</button>
          <button class="btn-primary" onclick="openItemForm(null, ${cat.id})">＋ 新增餐點</button>
        </div>
      </div>
      <table class="admin-table">
        <tr><th>名稱</th><th>價格</th><th>供應中</th><th>操作</th></tr>
        ${cat.items.map(i => `
          <tr>
            <td>${i.name}</td>
            <td>NT$ ${Number(i.price).toFixed(0)}</td>
            <td>${i.is_available ? '是' : '否'}</td>
            <td>
              <button class="btn-secondary" onclick="openItemForm(${i.id}, ${cat.id})">編輯</button>
              <button class="btn-danger" onclick="deleteItem(${i.id})">刪除</button>
            </td>
          </tr>`).join('')}
      </table>`;
    list.appendChild(block);
  });
}

function openCategoryForm(id) {
  const cat = categories.find(c => c.id === id);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet centered">
        <h2>${cat ? '編輯分類' : '新增分類'}</h2>
        <label>分類名稱</label>
        <input id="catName" value="${cat ? cat.name : ''}">
        <label>排序（數字越小越前面）</label>
        <input id="catSort" type="number" value="${cat ? cat.sort_order : 0}">
        <div style="display:flex;gap:10px;">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">取消</button>
          <button class="btn-primary" style="flex:1" onclick="saveCategory(${id || 'null'})">儲存</button>
        </div>
      </div>
    </div>`;
}

async function saveCategory(id) {
  const body = { name: document.getElementById('catName').value, sort_order: Number(document.getElementById('catSort').value) };
  if (!body.name.trim()) { alert('請輸入分類名稱'); return; }
  const url = id ? '/api/menu/categories/' + id : '/api/menu/categories';
  await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  closeModal();
  loadMenu();
}

async function deleteCategory(id) {
  if (!confirm('確定刪除此分類？分類內的餐點也會受影響。')) return;
  await fetch('/api/menu/categories/' + id, { method: 'DELETE' });
  loadMenu();
}

function openItemForm(id, categoryId) {
  const cat = categories.find(c => c.id === categoryId);
  const item = cat ? cat.items.find(i => i.id === id) : null;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet centered">
        <h2>${item ? '編輯餐點' : '新增餐點'}</h2>
        <label>名稱</label>
        <input id="itemName" value="${item ? item.name : ''}">
        <label>價格</label>
        <input id="itemPrice" type="number" value="${item ? item.price : 0}">
        <label>描述</label>
        <textarea id="itemDesc" rows="2">${item ? (item.description || '') : ''}</textarea>
        <label>排序</label>
        <input id="itemSort" type="number" value="${item ? item.sort_order : 0}">
        <label><input type="checkbox" id="itemAvail" style="width:auto;display:inline-block;" ${!item || item.is_available ? 'checked' : ''}> 供應中</label>
        <div style="display:flex;gap:10px;margin-top:10px;">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">取消</button>
          <button class="btn-primary" style="flex:1" onclick="saveItem(${id || 'null'}, ${categoryId})">儲存</button>
        </div>
      </div>
    </div>`;
}

async function saveItem(id, categoryId) {
  const body = {
    category_id: categoryId,
    name: document.getElementById('itemName').value,
    price: Number(document.getElementById('itemPrice').value),
    description: document.getElementById('itemDesc').value,
    sort_order: Number(document.getElementById('itemSort').value),
    is_available: document.getElementById('itemAvail').checked
  };
  if (!body.name.trim()) { alert('請輸入餐點名稱'); return; }
  const url = id ? '/api/menu/items/' + id : '/api/menu/items';
  await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  closeModal();
  loadMenu();
}

async function deleteItem(id) {
  if (!confirm('確定刪除此餐點？')) return;
  await fetch('/api/menu/items/' + id, { method: 'DELETE' });
  loadMenu();
}

/* ---------------- 桌位管理 ---------------- */
async function loadTables() {
  const res = await fetch('/api/tables');
  tables = await res.json();
  renderTablesPanel();
}

function renderTablesPanel() {
  const panel = document.getElementById('panel-tables');
  const origin = location.origin;
  panel.innerHTML = `
    <button class="btn-primary" onclick="openTableForm()">＋ 新增桌位</button>
    <button class="btn-secondary" onclick="window.open('table-cards.html','_blank')">🖨️ 列印精美桌卡</button>
    <p style="color:#777;font-size:13px;margin:10px 0;">列印 QR Code 貼在桌上，顧客掃描後即可進入該桌的點餐頁面。</p>
    <div class="qr-list">
      ${tables.map(t => {
        const link = origin + '/customer.html?t=' + t.qr_token;
        const qrImg = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(link);
        return `
        <div class="qr-card">
          <h3>${t.table_number}</h3>
          <img src="${qrImg}" alt="QR">
          <p style="font-size:12px;color:#777;">${t.seats} 人桌</p>
          <div style="display:flex;gap:6px;justify-content:center;margin-top:6px;">
            <button class="btn-secondary" onclick="openTableForm(${t.id})">編輯</button>
            <button class="btn-danger" onclick="deleteTable(${t.id})">刪除</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function openTableForm(id) {
  const t = tables.find(x => x.id === id);
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
      <div class="modal-sheet centered">
        <h2>${t ? '編輯桌位' : '新增桌位'}</h2>
        <label>桌號</label>
        <input id="tblNumber" value="${t ? t.table_number : ''}">
        <label>座位數</label>
        <input id="tblSeats" type="number" value="${t ? t.seats : 4}">
        <div style="display:flex;gap:10px;">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">取消</button>
          <button class="btn-primary" style="flex:1" onclick="saveTable(${id || 'null'})">儲存</button>
        </div>
      </div>
    </div>`;
}

async function saveTable(id) {
  const body = { table_number: document.getElementById('tblNumber').value, seats: Number(document.getElementById('tblSeats').value) };
  if (!body.table_number.trim()) { alert('請輸入桌號'); return; }
  const url = id ? '/api/tables/' + id : '/api/tables';
  await fetch(url, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  closeModal();
  loadTables();
}

async function deleteTable(id) {
  if (!confirm('確定刪除此桌位？')) return;
  await fetch('/api/tables/' + id, { method: 'DELETE' });
  loadTables();
}

/* ---------------- 訂單總覽 ---------------- */
async function loadOrders() {
  const res = await fetch('/api/orders');
  orders = (await res.json()).reverse();
  renderOrdersPanel();
}

function typeLabel(t) { return { dine_in: '內用', takeout: '外帶', delivery: '外送' }[t] || t; }
function statusLabel(s) { return { pending: '待確認', confirmed: '已確認', preparing: '準備中', ready: '待取餐', completed: '已完成', cancelled: '已取消' }[s] || s; }

function renderOrdersPanel() {
  const panel = document.getElementById('panel-orders');
  panel.innerHTML = `
    <table class="admin-table">
      <tr><th>訂單編號</th><th>類型</th><th>桌號/客人</th><th>金額</th><th>狀態</th><th>時間</th></tr>
      ${orders.map(o => `
        <tr>
          <td>${o.order_no}</td>
          <td>${typeLabel(o.order_type)}</td>
          <td>${o.dining_tables ? o.dining_tables.table_number : (o.customer_name || '-')}</td>
          <td>NT$ ${Number(o.total_amount).toFixed(0)}</td>
          <td><span class="tag ${o.status}">${statusLabel(o.status)}</span></td>
          <td>${new Date(o.created_at).toLocaleString('zh-TW')}</td>
        </tr>`).join('')}
    </table>`;
}

function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

loadMenu();
</script>
</body>
</html>
